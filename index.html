<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrompterCam Studio</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --main-color: #00ff66; /* Green default */
            --bg-color: #050505;
        }

        body.theme-green { --main-color: #00ff66; }
        body.theme-amber { --main-color: #ffb000; }
        body.theme-blue  { --main-color: #00aeff; }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #prompter-display {
            flex: 1;
            overflow-y: scroll;
            padding: 20px;
            font-size: 32px;
            line-height: 1.6;
            text-align: center;
            font-weight: bold;
            scrollbar-width: none;
        }

        #prompter-display::-webkit-scrollbar {
            display: none;
        }

        #controls {
            height: 60px;
            background: #111;
            border-top: 1px solid var(--main-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 5px;
            z-index: 10;
        }

        button, select {
            background: #000;
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 6px 10px;
            font-family: inherit;
            font-size: 12px;
            border-radius: 3px;
        }

        button:active {
            background: var(--main-color);
            color: #000;
        }

        .speed-btn {
            width: 36px;
            font-size: 16px;
            font-weight: bold;
            touch-action: manipulation;
        }

        /* Script Manager Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }

        #modal-overlay.active {
            display: flex;
        }

        .modal-header {
            font-size: 18px;
            border-bottom: 1px solid var(--main-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-view, .editor-view {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .script-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .script-item {
            padding: 12px;
            border: 1px solid var(--main-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
        }

        textarea {
            flex: 1;
            background: #000;
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 10px;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background: #000;
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 8px;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body class="theme-green">

    <div id="prompter-display">
        <!-- Script text renders here -->
    </div>

    <div id="controls">
        <button id="btn-play">PLAY</button>
        <button id="btn-color">COLOR</button>
        <button id="btn-scripts">SCRIPTS</button>
        <div style="display: flex; align-items: center; gap: 4px;">
            <button id="btn-speed-down" class="speed-btn">-</button>
            <span id="speed-val" style="min-width: 24px; text-align: center;">35</span>
            <button id="btn-speed-up" class="speed-btn">+</button>
        </div>
    </div>

    <!-- Script Folder / Editor Modal -->
    <div id="modal-overlay">
        <!-- Folder View -->
        <div id="view-folder" class="folder-view">
            <div class="modal-header">
                <span>SCRIPT MANAGER</span>
                <button id="btn-close-modal">X</button>
            </div>
            <div id="script-list" class="script-list"></div>
            <div class="actions">
                <button id="btn-new-script">+ NEW SCRIPT</button>
            </div>
        </div>

        <!-- Editor View -->
        <div id="view-editor" class="editor-view" style="display: none;">
            <div class="modal-header">
                <span>EDIT SCRIPT</span>
            </div>
            <input type="text" id="script-title" placeholder="Script Title">
            <textarea id="script-body" placeholder="Type or paste script content here..."></textarea>
            <div class="actions">
                <button id="btn-delete-script" style="color: #ff4444; border-color: #ff4444;">DELETE</button>
                <button id="btn-cancel-edit">CANCEL</button>
                <button id="btn-save-script">SAVE</button>
            </div>
        </div>
    </div>

    <script>
        // Default Scripts Data
        let scripts = JSON.parse(localStorage.getItem('prompter_scripts')) || [
            {
                id: '1',
                title: 'Default - Preservation',
                content: `Every piece of fallen timber has a story that is supposed to end in decay.\n\nAs carvers, we interrupt that ending.\n\nWe force the wood to take a new breath.\n\nWe carve a second life into it.`
            }
        ];

        let activeScriptId = localStorage.getItem('prompter_active_id') || '1';
        let speed = parseInt(localStorage.getItem('prompter_speed')) || 35;
        let isScrolling = false;
        let scrollInterval = null;
        let speedHoldTimer = null;
        let speedHoldInterval = null;

        const themes = ['theme-green', 'theme-amber', 'theme-blue'];
        let currentThemeIdx = parseInt(localStorage.getItem('prompter_theme_idx')) || 0;

        // Elements
        const display = document.getElementById('prompter-display');
        const btnPlay = document.getElementById('btn-play');
        const btnColor = document.getElementById('btn-color');
        const btnScripts = document.getElementById('btn-scripts');
        const btnSpeedUp = document.getElementById('btn-speed-up');
        const btnSpeedDown = document.getElementById('btn-speed-down');
        const speedVal = document.getElementById('speed-val');
        
        const modal = document.getElementById('modal-overlay');
        const viewFolder = document.getElementById('view-folder');
        const viewEditor = document.getElementById('view-editor');
        const scriptList = document.getElementById('script-list');
        const inputTitle = document.getElementById('script-title');
        const inputBody = document.getElementById('script-body');
        
        let editingScriptId = null;

        // Initialize App
        function init() {
            applyTheme();
            updateSpeedDisplay();
            loadActiveScript();
            
            // Event Listeners
            btnPlay.addEventListener('click', toggleScroll);
            btnColor.addEventListener('click', cycleTheme);
            btnScripts.addEventListener('click', openFolder);
            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            
            setupHoldButton(btnSpeedUp, 1);
            setupHoldButton(btnSpeedDown, -1);

            document.getElementById('btn-new-script').addEventListener('click', () => openEditor());
            document.getElementById('btn-cancel-edit').addEventListener('click', showFolderView);
            document.getElementById('btn-save-script').addEventListener('click', saveScript);
            document.getElementById('btn-delete-script').addEventListener('click', deleteScript);
        }

        // Theme management
        function applyTheme() {
            document.body.className = themes[currentThemeIdx];
            localStorage.setItem('prompter_theme_idx', currentThemeIdx);
        }

        function cycleTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            applyTheme();
        }

        // Speed adjustment with Press & Hold support
        function changeSpeed(delta) {
            speed = Math.max(5, Math.min(100, speed + delta));
            updateSpeedDisplay();
            if (isScrolling) {
                startScroll(); // Reset interval timing
            }
        }

        function updateSpeedDisplay() {
            speedVal.innerText = speed;
            localStorage.setItem('prompter_speed', speed);
        }

        function setupHoldButton(btn, delta) {
            const start = (e) => {
                e.preventDefault();
                changeSpeed(delta);
                speedHoldTimer = setTimeout(() => {
                    speedHoldInterval = setInterval(() => changeSpeed(delta), 80);
                }, 300);
            };

            const stop = () => {
                clearTimeout(speedHoldTimer);
                clearInterval(speedHoldInterval);
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', stop);
        }

        // Scrolling Logic
        function toggleScroll() {
            if (isScrolling) {
                stopScroll();
            } else {
                startScroll();
            }
        }

        function startScroll() {
            stopScroll();
            isScrolling = true;
            btnPlay.innerText = "PAUSE";
            scrollInterval = setInterval(() => {
                display.scrollTop += 1;
            }, 1000 / speed);
        }

        function stopScroll() {
            isScrolling = false;
            btnPlay.innerText = "PLAY";
            clearInterval(scrollInterval);
        }

        // Script Loading
        function loadActiveScript() {
            const script = scripts.find(s => s.id === activeScriptId) || scripts[0];
            if (script) {
                display.innerText = script.content;
                activeScriptId = script.id;
                localStorage.setItem('prompter_active_id', activeScriptId);
            }
        }

        // Modal / Folder System
        function openFolder() {
            stopScroll();
            renderFolderList();
            showFolderView();
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function showFolderView() {
            viewFolder.style.display = 'flex';
            viewEditor.style.display = 'none';
        }

        function renderFolderList() {
            scriptList.innerHTML = '';
            scripts.forEach(s => {
                const item = document.createElement('div');
                item.className = 'script-item';
                item.innerHTML = `
                    <span>${s.title || 'Untitled'} ${s.id === activeScriptId ? '✓' : ''}</span>
                    <div>
                        <button onclick="selectScript('${s.id}')">LOAD</button>
                        <button onclick="openEditor('${s.id}')">EDIT</button>
                    </div>
                `;
                scriptList.appendChild(item);
            });
        }

        window.selectScript = function(id) {
            activeScriptId = id;
            loadActiveScript();
            closeModal();
        };

        window.openEditor = function(id = null) {
            editingScriptId = id;
            if (id) {
                const s = scripts.find(item => item.id === id);
                inputTitle.value = s.title;
                inputBody.value = s.content;
                document.getElementById('btn-delete-script').style.display = 'block';
            } else {
                inputTitle.value = '';
                inputBody.value = '';
                document.getElementById('btn-delete-script').style.display = 'none';
            }
            viewFolder.style.display = 'none';
            viewEditor.style.display = 'flex';
        };

        function saveScript() {
            const title = inputTitle.value.trim() || 'Untitled Script';
            const content = inputBody.value;

            if (editingScriptId) {
                const s = scripts.find(item => item.id === editingScriptId);
                s.title = title;
                s.content = content;
            } else {
                const newId = Date.now().toString();
                scripts.push({ id: newId, title, content });
                activeScriptId = newId;
            }

            localStorage.setItem('prompter_scripts', JSON.stringify(scripts));
            loadActiveScript();
            renderFolderList();
            showFolderView();
        }

        function deleteScript() {
            if (!editingScriptId) return;
            scripts = scripts.filter(s => s.id !== editingScriptId);
            if (activeScriptId === editingScriptId) {
                activeScriptId = scripts[0] ? scripts[0].id : null;
            }
            localStorage.setItem('prompter_scripts', JSON.stringify(scripts));
            loadActiveScript();
            renderFolderList();
            showFolderView();
        }

        init();
    </script>
</body>
</html>
