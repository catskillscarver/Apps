<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrompterCam Studio</title>

    <!-- PWA & Standalone Engine Headers -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c0a05">

    <!-- Linked App Icon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
    <link rel="apple-touch-icon" href="icon.svg?v=2">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --crt-amber: #ffb000;
            --crt-green: #33ff33;
            --crt-red: #ff3333;
            --crt-blue: #00aeff;
            --main-color: var(--crt-green); /* Default is now green */
            --bg-color: #050c05;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* LIVE CAMERA PREVIEW BACKDROP */
        #cameraPreview {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 10;
            transform: scaleX(-1);
        }

        /* FRAMING GRID OVERLAY */
        #framingGrid {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 15;
            pointer-events: none;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        #framingGrid::before, #framingGrid::after {
            content: "";
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }

        #framingGrid::before {
            top: 0; bottom: 0;
            left: 33.33%; right: 33.33%;
            border-left: 1px dashed rgba(255, 255, 255, 0.3);
            border-right: 1px dashed rgba(255, 255, 255, 0.3);
        }

        #framingGrid::after {
            left: 0; right: 0;
            top: 33.33%; bottom: 33.33%;
            border-top: 1px dashed rgba(255, 255, 255, 0.3);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
        }

        /* RETRO CRT SCANLINES */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 200;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
            z-index: 201;
        }

        /* HIGH-EYELINE FOCUS GUIDE AT TOP OF SCREEN */
        .focus-overlay {
            position: fixed;
            top: 10px;
            left: 0; right: 0;
            height: 180px;
            background: rgba(255, 176, 0, 0.08);
            border-top: 2px dashed var(--main-color);
            border-bottom: 2px dashed var(--main-color);
            pointer-events: none;
            z-index: 100;
        }

        /* MAXIMIZED TELEPROMPTER SCROLL BOX */
        .prompter-container {
            flex: 1;
            overflow-y: scroll;
            margin-top: 0px;
            margin-bottom: 70px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            z-index: 50;
            background: rgba(12, 10, 5, 0.45);
        }

        .prompter-container::-webkit-scrollbar {
            display: none;
        }

        .prompter-content {
            padding-top: 20px;
            padding-bottom: 80vh;
            text-align: center;
        }

        .prompter-text {
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 0 10px var(--main-color), 0 0 20px #000, 0 0 30px #000;
            letter-spacing: 1px;
            word-wrap: break-word;
            padding: 0 10px;
        }

        .flipped {
            transform: scaleX(-1);
        }

        /* BOTTOM DOCKED CONTROL BAR */
        .controls {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(20, 18, 12, 0.95);
            border-top: 2px solid var(--main-color);
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            z-index: 300;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button, select {
            background: #242014;
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 6px 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        button:active, button.active {
            background: var(--main-color);
            color: #000;
        }

        .step-btn {
            padding: 4px 8px;
            font-size: 13px;
            line-height: 1;
            min-width: 28px;
            text-align: center;
            touch-action: none;
            user-select: none;
        }

        button.recording {
            background: var(--crt-red) !important;
            color: #fff !important;
            border-color: #fff !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        select {
            outline: none;
            max-width: 100px;
        }

        .slider-label {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="range"] {
            accent-color: var(--main-color);
            cursor: pointer;
            width: 50px;
        }

        /* NEW FOLDER & EDITOR MODAL SYSTEM */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 400;
            padding: 20px;
            flex-direction: column;
        }

        .modal.open {
            display: flex;
        }

        .modal-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* Folder View Specifics */
        #folderView { display: flex; flex-direction: column; height: 100%; }
        #scriptList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .script-item {
            border: 1px solid var(--main-color);
            background: rgba(20, 18, 12, 0.8);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .script-item-title { font-size: 16px; font-weight: bold; word-break: break-all; }
        .script-item-actions { display: flex; gap: 8px; }
        .script-item-actions button { flex: 1; padding: 10px; font-size: 14px; }

        /* Editor View Specifics */
        #editorView { display: none; flex-direction: column; height: 100%; }
        #scriptTitleInput, #scriptTextInput {
            background: #050505;
            color: var(--main-color);
            border: 1px solid var(--main-color);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            width: 100%;
            margin-bottom: 15px;
        }
        #scriptTitleInput { font-size: 16px; font-weight: bold; }
        #scriptTextInput { flex: 1; font-size: 16px; resize: none; }
        .editor-actions { display: flex; gap: 10px; justify-content: space-between; }
        .editor-actions button { flex: 1; padding: 12px; font-size: 14px; }

        /* MEDIA PLAYBACK PANEL */
        #mediaPlayerContainer {
            display: none;
            position: fixed;
            bottom: 75px; left: 10px; right: 10px;
            background: #14120c;
            border: 2px solid var(--main-color);
            padding: 10px;
            z-index: 350;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .prompter-container { padding: 0 5%; }
            .prompter-text { font-size: 36px; }
        }

        @media (min-width: 601px) {
            .prompter-container { padding: 0 18%; }
            .prompter-text { font-size: 52px; }
        }
    </style>
</head>
<body>

    <!-- Live Camera Backdrop -->
    <video id="cameraPreview" autoplay playsinline muted></video>

    <!-- Framing Grid Overlay -->
    <div id="framingGrid"></div>

    <!-- High Eyeline Focus Box (Top Edge) -->
    <div class="focus-overlay"></div>

    <!-- Maximized Scrolling Area -->
    <div class="prompter-container" id="scrollBox" onclick="handleContainerClick(event)">
        <div class="prompter-content" id="textContent">
            <div class="prompter-text" id="scriptDisplay"></div>
        </div>
    </div>

    <!-- Controls Bar Docked at Bottom -->
    <div class="controls">
        <div class="control-group">
            <button id="toggleBtn" onclick="toggleScroll()">PLAY</button>
            <button id="camToggleBtn" onclick="toggleCamera()">CAM: OFF</button>
            <button id="recVideoBtn" onclick="toggleVideoRecording()">REC VIDEO</button>
            <select id="micSelect" onchange="switchMicrophone()">
                <option value="">DEFAULT MIC</option>
            </select>
        </div>

        <div class="control-group">
            <select id="qualitySelect" onchange="updateVideoQuality()">
                <option value="1080">1080p FHD</option>
                <option value="2160">4K UHD</option>
                <option value="720">720p HD</option>
            </select>
            <button id="gridToggleBtn" onclick="toggleGrid()">GRID</button>
            <select id="scriptSelect" onchange="loadSelectedFromDropdown()"></select>
            <button onclick="openScriptManager()">SCRIPTS</button>
            <button id="colorBtn" onclick="toggleColor()">COLOR</button>
            <button id="flipBtn" onclick="toggleMirror()">MIRROR</button>
        </div>

        <!-- FINE-TUNING SPEED CONTROLS (Hold-to-Adjust) -->
        <div class="control-group">
            <span class="slider-label">SPD</span>
            <button class="step-btn" id="btnSpeedDown">–</button>
            <input type="range" id="speedSlider" min="1" max="300" value="30" oninput="updateSpeed(this.value)">
            <button class="step-btn" id="btnSpeedUp">+</button>
            <span id="speedVal" style="font-size:10px; font-weight:bold; min-width: 22px;">30</span>
        </div>
    </div>

    <!-- Video Recording Playback Bar -->
    <div id="mediaPlayerContainer">
        <span style="font-size: 11px; font-weight: bold;">TAKE READY:</span>
        <a id="downloadVideoBtn" download="teleprompter_take.webm" style="color: var(--main-color); text-decoration: underline; font-size: 12px; font-weight: bold;">DOWNLOAD TAKE</a>
        <button onclick="closeMediaPlayer()">DISMISS</button>
    </div>

    <!-- SCRIPT MANAGER MODAL (Folder & Editor) -->
    <div class="modal" id="scriptManagerModal">
        
        <!-- FOLDER VIEW -->
        <div id="folderView">
            <div class="modal-header">
                <h3 style="color: var(--main-color);">SCRIPT FOLDER</h3>
                <button onclick="closeModal()" style="padding: 6px 12px; font-size: 16px;">X</button>
            </div>
            <div id="scriptList">
                <!-- Scripts are injected here via JS -->
            </div>
            <button onclick="openEditor()" style="background: var(--main-color); color: #000; padding: 15px; font-size: 18px; width: 100%;">+ NEW SCRIPT</button>
        </div>

        <!-- EDITOR VIEW -->
        <div id="editorView">
            <div class="modal-header">
                <h3 style="color: var(--main-color);" id="editorHeader">EDIT SCRIPT</h3>
            </div>
            <input type="text" id="scriptTitleInput" placeholder="Enter Script Title...">
            <textarea id="scriptTextInput" placeholder="Paste your script text here..."></textarea>
            <div class="editor-actions">
                <button onclick="showFolderView()" style="border-color: #888; color: #aaa;">CANCEL</button>
                <button onclick="saveCurrentScript()" style="background: var(--main-color); color: #000;">SAVE SCRIPT</button>
            </div>
        </div>

    </div>

    <script>
        // NEW DEFAULT DEMO SCRIPT
        const defaultLibrary = {
            "Demo Script": `This is a simple demo script.\n\nUse the SCRIPTS button below to open your folder.\n\nFrom there, you can add new scripts, delete this one, or rename files easily.\n\nHappy carving.`
        };

        let isScrolling = false;
        let scrollSpeed = 3.0;
        let scrollBox = document.getElementById('scrollBox');
        let toggleBtn = document.getElementById('toggleBtn');
        let recVideoBtn = document.getElementById('recVideoBtn');
        let camToggleBtn = document.getElementById('camToggleBtn');
        let gridToggleBtn = document.getElementById('gridToggleBtn');
        let cameraPreview = document.getElementById('cameraPreview');
        let framingGrid = document.getElementById('framingGrid');
        let textContent = document.getElementById('textContent');
        let scriptDisplay = document.getElementById('scriptDisplay');
        let scriptSelect = document.getElementById('scriptSelect');
        let micSelect = document.getElementById('micSelect');
        let qualitySelect = document.getElementById('qualitySelect');
        let speedSlider = document.getElementById('speedSlider');
        let speedVal = document.getElementById('speedVal');
        
        let scriptManagerModal = document.getElementById('scriptManagerModal');
        let folderView = document.getElementById('folderView');
        let editorView = document.getElementById('editorView');
        let scriptList = document.getElementById('scriptList');
        let scriptTitleInput = document.getElementById('scriptTitleInput');
        let scriptTextInput = document.getElementById('scriptTextInput');
        let editorHeader = document.getElementById('editorHeader');
        
        let animationFrameId = null;
        let isGridActive = false;
        let originalEditingTitle = null; 

        let cameraStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isVideoRecording = false;

        // Theme Data Array (Green -> Amber -> Blue)
        const themeColors = [
            { main: 'var(--crt-green)', bg: '#050c05' },
            { main: 'var(--crt-amber)', bg: '#0c0a05' },
            { main: 'var(--crt-blue)', bg: '#050a0c' }
        ];
        let currentThemeIndex = 0;

        function triggerNativeFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Fullscreen request bypassed");
                });
            }
        }

        // --- SCRIPT LIBRARY MANAGEMENT ---
        function getLibrary() {
            const data = localStorage.getItem('teleprompter_library');
            return data ? JSON.parse(data) : defaultLibrary;
        }

        function saveLibrary(lib) {
            localStorage.setItem('teleprompter_library', JSON.stringify(lib));
            populateDropdown();
        }

        function populateDropdown() {
            const lib = getLibrary();
            scriptSelect.innerHTML = '';
            const titles = Object.keys(lib);
            
            if (titles.length === 0) {
                let opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "NO SCRIPTS";
                scriptSelect.appendChild(opt);
                scriptDisplay.innerHTML = "";
                return;
            }

            for (let title of titles) {
                let opt = document.createElement('option');
                opt.value = title;
                opt.innerText = title;
                scriptSelect.appendChild(opt);
            }

            const activeTitle = localStorage.getItem('active_script_title');
            if (activeTitle && lib[activeTitle]) {
                scriptSelect.value = activeTitle;
                displayScript(lib[activeTitle]);
            } else {
                scriptSelect.value = titles[0];
                localStorage.setItem('active_script_title', titles[0]);
                displayScript(lib[titles[0]]);
            }
        }

        function displayScript(text) {
            scriptDisplay.innerHTML = text.replace(/\n/g, '<br>');
        }

        function loadSelectedFromDropdown() {
            const lib = getLibrary();
            const selectedTitle = scriptSelect.value;
            if (lib[selectedTitle]) {
                localStorage.setItem('active_script_title', selectedTitle);
                displayScript(lib[selectedTitle]);
                resetScroll();
            }
        }

        function loadScriptFromFolder(title) {
            const lib = getLibrary();
            if (lib[title]) {
                localStorage.setItem('active_script_title', title);
                populateDropdown(); 
                resetScroll();
                closeModal();
            }
        }

        // --- FOLDER & EDITOR MODAL SYSTEM ---
        function openScriptManager() {
            if (isScrolling) toggleScroll();
            renderFolderList();
            showFolderView();
            scriptManagerModal.classList.add('open');
        }

        function closeModal() {
            scriptManagerModal.classList.remove('open');
        }

        function showFolderView() {
            editorView.style.display = 'none';
            folderView.style.display = 'flex';
        }

        function renderFolderList() {
            const lib = getLibrary();
            scriptList.innerHTML = '';
            const activeTitle = localStorage.getItem('active_script_title');

            if (Object.keys(lib).length === 0) {
                scriptList.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Folder is empty.</div>';
                return;
            }

            for (let title in lib) {
                const isLoaded = title === activeTitle;
                const item = document.createElement('div');
                item.className = 'script-item';
                if (isLoaded) item.style.borderColor = '#fff'; 

                item.innerHTML = `
                    <div class="script-item-title">${title} ${isLoaded ? '(ACTIVE)' : ''}</div>
                    <div class="script-item-actions">
                        <button onclick="loadScriptFromFolder('${title.replace(/'/g, "\\'")}')" style="background: ${isLoaded ? 'var(--main-color)' : '#242014'}; color: ${isLoaded ? '#000' : 'var(--main-color)'};">LOAD</button>
                        <button onclick="openEditor('${title.replace(/'/g, "\\'")}')">EDIT</button>
                        <button onclick="deleteScript('${title.replace(/'/g, "\\'")}')" style="border-color: var(--crt-red); color: var(--crt-red);">DEL</button>
                    </div>
                `;
                scriptList.appendChild(item);
            }
        }

        function openEditor(title = null) {
            const lib = getLibrary();
            originalEditingTitle = title;

            if (title && lib[title]) {
                editorHeader.innerText = "EDIT SCRIPT";
                scriptTitleInput.value = title;
                scriptTextInput.value = lib[title];
            } else {
                editorHeader.innerText = "NEW SCRIPT";
                scriptTitleInput.value = "";
                scriptTextInput.value = "";
            }

            folderView.style.display = 'none';
            editorView.style.display = 'flex';
        }

        function saveCurrentScript() {
            let newTitle = scriptTitleInput.value.trim();
            const text = scriptTextInput.value;
            const lib = getLibrary();

            if (!newTitle) {
                newTitle = "Untitled Script " + (Object.keys(lib).length + 1);
            }

            if (originalEditingTitle && originalEditingTitle !== newTitle) {
                delete lib[originalEditingTitle];
                if (localStorage.getItem('active_script_title') === originalEditingTitle) {
                    localStorage.setItem('active_script_title', newTitle);
                }
            }

            lib[newTitle] = text;
            saveLibrary(lib);
            
            localStorage.setItem('active_script_title', newTitle);
            populateDropdown(); 
            
            renderFolderList();
            showFolderView();
        }

        function deleteScript(title) {
            if (confirm(`Are you sure you want to delete "${title}"?`)) {
                const lib = getLibrary();
                delete lib[title];
                
                const remainingTitles = Object.keys(lib);
                if (localStorage.getItem('active_script_title') === title) {
                    if (remainingTitles.length > 0) {
                        localStorage.setItem('active_script_title', remainingTitles[0]);
                    } else {
                        localStorage.removeItem('active_script_title');
                    }
                }
                
                saveLibrary(lib);
                renderFolderList();
            }
        }

        // --- SCROLLING & SPEED ---
        function scrollStep() {
            if (isScrolling) {
                scrollBox.scrollTop += scrollSpeed / 10;
                if (scrollBox.scrollTop + scrollBox.clientHeight >= scrollBox.scrollHeight - 5) {
                    toggleScroll();
                } else {
                    animationFrameId = requestAnimationFrame(scrollStep);
                }
            }
        }

        function toggleScroll() {
            triggerNativeFullscreen();
            const lib = getLibrary();
            if(Object.keys(lib).length === 0) return; 

            isScrolling = !isScrolling;
            if (isScrolling) {
                toggleBtn.innerText = "PAUSE";
                toggleBtn.classList.add("active");
                animationFrameId = requestAnimationFrame(scrollStep);
            } else {
                toggleBtn.innerText = "PLAY";
                toggleBtn.classList.remove("active");
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            }
        }

        function handleContainerClick(e) {
            if (e.target.closest('.controls') || e.target.closest('#mediaPlayerContainer') || e.target.closest('.modal')) return;
            toggleScroll();
        }

        function resetScroll() {
            if (isScrolling) toggleScroll();
            scrollBox.scrollTop = 0;
        }

        function updateSpeed(val) {
            speedVal.innerText = val;
            speedSlider.value = val;
            scrollSpeed = parseFloat(val) / 10;
        }

        function adjustSpeed(delta) {
            let currentVal = parseInt(speedSlider.value) || 30;
            let newVal = Math.min(300, Math.max(1, currentVal + delta));
            updateSpeed(newVal);
        }

        function bindHoldEvent(btn, delta) {
            let holdTimer = null;
            let holdInterval = null;

            const startHold = (e) => {
                e.preventDefault(); 
                adjustSpeed(delta);
                clearHold();
                holdTimer = setTimeout(() => {
                    holdInterval = setInterval(() => adjustSpeed(delta), 60);
                }, 250);
            };

            const clearHold = () => {
                if (holdTimer) clearTimeout(holdTimer);
                if (holdInterval) clearInterval(holdInterval);
            };

            btn.addEventListener('pointerdown', startHold);
            btn.addEventListener('pointerup', clearHold);
            btn.addEventListener('pointercancel', clearHold);
            btn.addEventListener('pointerleave', clearHold);
            btn.addEventListener('contextmenu', e => e.preventDefault());
        }

        function handleManualScroll() {
            if (isScrolling) {
                toggleScroll();
            }
        }

        scrollBox.addEventListener('wheel', handleManualScroll, { passive: true });
        scrollBox.addEventListener('touchmove', handleManualScroll, { passive: true });

        // --- VISUAL TWEAKS (Mirror & Color) ---
        function toggleMirror() {
            textContent.classList.toggle('flipped');
            document.getElementById('flipBtn').classList.toggle('active');
        }

        function toggleColor() {
            currentThemeIndex = (currentThemeIndex + 1) % themeColors.length;
            const root = document.documentElement;
            root.style.setProperty('--main-color', themeColors[currentThemeIndex].main);
            root.style.setProperty('--bg-color', themeColors[currentThemeIndex].bg);
        }

        // --- CAMERA & VIDEO (Optimized for Raw Quality) ---
        async function populateMicrophones() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                micSelect.innerHTML = '';
                audioInputs.forEach((device, index) => {
                    let opt = document.createElement('option');
                    opt.value = device.deviceId;
                    opt.innerText = device.label || `Microphone ${index + 1}`;
                    micSelect.appendChild(opt);
                });
            } catch (e) {
                console.warn("Unable to enumerate audio devices.");
            }
        }

        async function switchMicrophone() {
            if (cameraStream) {
                await toggleCamera();
                await toggleCamera();
            }
        }

        async function toggleCamera() {
            triggerNativeFullscreen();
            if (!cameraStream) {
                const targetHeight = parseInt(qualitySelect.value) || 1080;
                const targetWidth = targetHeight === 2160 ? 3840 : (targetHeight === 1080 ? 1920 : 1280);
                const selectedMicId = micSelect.value;

                // Create constraints that disable web-conferencing filters for better raw audio
                const audioConstraints = {
                    echoCancellation: false,
                    autoGainControl: false,
                    noiseSuppression: false,
                    sampleRate: 48000
                };
                if (selectedMicId) {
                    audioConstraints.deviceId = { exact: selectedMicId };
                }

                const constraints = {
                    video: {
                        facingMode: "user",
                        width: { ideal: targetWidth },
                        height: { ideal: targetHeight },
                        frameRate: { ideal: 30, max: 60 }
                    },
                    audio: audioConstraints
                };

                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    cameraPreview.srcObject = cameraStream;
                    cameraPreview.style.display = 'block';
                    camToggleBtn.innerText = "CAM: ON";
                    camToggleBtn.classList.add("active");
                    await populateMicrophones();
                } catch (err) {
                    alert("Unable to access camera or selected microphone.");
                }
            } else {
                let tracks = cameraStream.getTracks();
                tracks.forEach(track => track.stop());
                cameraPreview.style.display = 'none';
                cameraStream = null;
                camToggleBtn.innerText = "CAM: OFF";
                camToggleBtn.classList.remove("active");
            }
        }

        async function updateVideoQuality() {
            if (cameraStream) {
                await toggleCamera();
                await toggleCamera();
            }
        }

        function toggleGrid() {
            isGridActive = !isGridActive;
            if (isGridActive) {
                framingGrid.style.display = 'block';
                gridToggleBtn.classList.add('active');
            } else {
                framingGrid.style.display = 'none';
                gridToggleBtn.classList.remove('active');
            }
        }

        async function toggleVideoRecording() {
            triggerNativeFullscreen();
            if (!isVideoRecording) {
                if (!cameraStream) {
                    await toggleCamera();
                }
                if (!cameraStream) return;

                recordedChunks = [];
                // Increased bitrates for higher quality video and audio captures
                const options = {
                    mimeType: 'video/webm;codecs=vp9,opus',
                    videoBitsPerSecond: 20000000, 
                    audioBitsPerSecond: 128000
                };

                try {
                    mediaRecorder = new MediaRecorder(cameraStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(cameraStream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const downloadBtn = document.getElementById('downloadVideoBtn');
                    downloadBtn.href = url;
                    document.getElementById('mediaPlayerContainer').style.display = 'flex';
                };

                mediaRecorder.start();
                isVideoRecording = true;
                recVideoBtn.innerText = "STOP REC";
                recVideoBtn.classList.add("recording");

                if (!isScrolling) toggleScroll();
            } else {
                mediaRecorder.stop();
                isVideoRecording = false;
                recVideoBtn.innerText = "REC VIDEO";
                recVideoBtn.classList.remove("recording");
                if (isScrolling) toggleScroll();
            }
        }

        function closeMediaPlayer() {
            document.getElementById('mediaPlayerContainer').style.display = 'none';
        }

        // --- VISIBILITY LISTENER (Auto-Kill Camera in Background) ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && cameraStream) {
                if (isVideoRecording) {
                    // Safely stop recording so the file can still be downloaded
                    toggleVideoRecording(); 
                }
                // Turn off the hardware feed
                toggleCamera(); 
            }
        });

        // Initialize Data and Events
        populateDropdown();
        navigator.mediaDevices?.addEventListener('devicechange', populateMicrophones);
        bindHoldEvent(document.getElementById('btnSpeedUp'), 1);
        bindHoldEvent(document.getElementById('btnSpeedDown'), -1);
    </script>
</body>
</html>
