<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Studio Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c1912"/>
      <stop offset="100%" stop-color="#080705"/>
    </radialGradient>

    <!-- Bezel Metallic Finish -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3326"/>
      <stop offset="50%" stop-color="#1f1b14"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </linearGradient>

    <!-- CRT Screen Inner Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#332200"/>
      <stop offset="80%" stop-color="#120c00"/>
      <stop offset="100%" stop-color="#050300"/>
    </radialGradient>

    <!-- Scanline Overlay -->
    <pattern id="scanlines" width="100" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="2" opacity="0.35"/>
    </pattern>

    <!-- Glass Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter for Amber Text -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tally Light Glow -->
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Outer Bezel Frame -->
  <rect x="32" y="32" width="448" height="448" rx="85" fill="url(#bezelGrad)" stroke="#ffb000" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Screen Inner Display -->
  <rect x="52" y="52" width="408" height="408" rx="65" fill="url(#screenGlow)" stroke="#1a1200" stroke-width="6"/>

  <!-- CRT Scanlines Overlay -->
  <rect x="52" y="52" width="408" height="408" rx="65" fill="url(#scanlines)"/>

  <!-- Reading Focus Box -->
  <rect x="72" y="160" width="368" height="130" rx="12" fill="#ffb000" fill-opacity="0.08" stroke="#ffb000" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>

  <!-- Glowing Amber Typography -->
  <g filter="url(#amberGlow)" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#ffb000">
    <!-- Main App Title -->
    <text x="256" y="222" font-size="38" text-anchor="middle" opacity="1.0" letter-spacing="2">PROMPTER CAM</text>
    <text x="256" y="262" font-size="22" text-anchor="middle" opacity="0.8" letter-spacing="4">STUDIO</text>
    
    <!-- Cleaned Subtext Below -->
    <text x="256" y="360" font-size="22" text-anchor="middle" opacity="0.6" letter-spacing="2">RECORD TELEPROMPTER</text>
  </g>

  <!-- Live Recording Indicator Light (Top Right) -->
  <g filter="url(#redGlow)">
    <circle cx="410" cy="95" r="14" fill="#ff3333"/>
  </g>
  <circle cx="410" cy="95" r="6" fill="#ffffff" opacity="0.8"/>

  <!-- Glass Sheen Glare -->
  <path d="M 52 117 C 52 81, 81 52, 117 52 L 395 52 C 431 52, 460 81, 460 117 L 460 180 L 52 320 Z" fill="url(#glassReflect)"/>
</svg>
